<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="bs-token" content="{{TOKEN}}">
<title>BooruScope</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img class="logo" src="/assets/icon.svg" alt="">
    <span data-i18n="app.title"></span>
  </div>
  <div class="controls">
    <label class="ctl">
      <span data-i18n="rowCap.label"></span>
      <input type="range" id="rowCap" min="3" max="6" step="1">
      <output id="rowCapVal"></output>
    </label>
    <label class="ctl">
      <span data-i18n="variant.label"></span>
      <select id="variant"></select>
    </label>
    <label class="ctl chk">
      <input type="checkbox" id="rerank">
      <span id="rerankText"></span>
    </label>
    <span class="ctl idle" id="idleBox">
      <label class="chk"><input type="checkbox" id="idleUnload"><span data-i18n="idle.label"></span></label>
      <input type="number" id="idleMinutes" min="1" max="1440" step="1">
      <span data-i18n="idle.minutes"></span>
      <span class="countdown" id="idleCountdown"></span>
    </span>
    <label class="ctl chk" id="offlineBox">
      <input type="checkbox" id="offline">
      <span data-i18n="offline.label"></span>
    </label>
    <div class="seg" id="lang" role="group">
      <button type="button" data-lang="en" lang="en" title="English">EN</button>
      <button type="button" data-lang="zh" lang="zh-Hant" title="中文">中文</button>
      <button type="button" data-lang="ja" lang="ja" title="日本語">日本語</button>
    </div>
  </div>
</header>
<div class="strip">
  <span class="pill"><span class="dot" id="encDot"></span><span class="ptext" id="encText"></span><button type="button" class="link" id="encRetry" hidden data-i18n="enc.retry"></button></span>
  <span class="pill"><span class="dot" id="libDot"></span><span class="ptext" id="libText"></span></span>
  <span class="msgline" id="msgline"></span>
</div>
<div class="stage">
<div class="drift paused" id="drift" aria-hidden="true"><div class="drift-scene" id="driftScene"></div></div>
<main class="results" id="results">
  <div class="spacer" id="spacer"></div>
  <div class="empty" id="empty">
    <img class="empty-art" src="/assets/drop.svg" alt="">
    <h1 id="emptyTitle" data-i18n="drop.title"></h1>
    <p id="emptyHint" data-i18n="drop.hint"></p>
    <p class="missing" id="missingHelp" hidden><span data-i18n="lib.missingHelp"></span><code id="missingDir"></code></p>
  </div>
</main>
</div>
<div class="drop-overlay" id="dropOverlay"><div data-i18n="drop.overlay"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
